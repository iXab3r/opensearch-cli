<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="People, AI agents and Node.js code use one opensearch-cli command tree, which applies profiles, the secret store, a permission gate, partial-result checks and diagnostic redaction before calling the OpenSearch REST API"><rect width="880" height="384" rx="10" fill="#fcfcfb"/><rect x="16" y="67" width="190" height="64" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="111" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">People</text><text x="111" y="114" text-anchor="middle" font-size="12" fill="#52514e">readable tables and records</text><path d="M206 99 C241 99 241 192 269 192" fill="none" stroke="#52514e" stroke-width="1.5"/><path d="M276 192 l-8 -4.5 v9 z" fill="#52514e"/><rect x="16" y="160" width="190" height="64" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="111" y="189" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">AI agents and scripts</text><text x="111" y="207" text-anchor="middle" font-size="12" fill="#52514e">--json  ·  --json-rpc</text><path d="M206 192 C241 192 241 192 269 192" fill="none" stroke="#52514e" stroke-width="1.5"/><path d="M276 192 l-8 -4.5 v9 z" fill="#52514e"/><rect x="16" y="253" width="190" height="64" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="111" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Node.js code</text><text x="111" y="300" text-anchor="middle" font-size="12" fill="#52514e">import the command tree</text><path d="M206 285 C241 285 241 192 269 192" fill="none" stroke="#52514e" stroke-width="1.5"/><path d="M276 192 l-8 -4.5 v9 z" fill="#52514e"/><rect x="276" y="20" width="330" height="344" rx="10" fill="none" stroke="#256abf" stroke-width="1.5"/><text x="441" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">opensearch-cli</text><text x="441" y="67" text-anchor="middle" font-size="12" fill="#52514e">one command tree, 35 OpenSearch commands</text><rect x="294" y="84" width="294" height="46" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="441" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Profiles</text><text x="441" y="122" text-anchor="middle" font-size="12" fill="#52514e">several clusters · basic, bearer or none</text><rect x="294" y="138" width="294" height="46" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="441" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Secret store</text><text x="441" y="176" text-anchor="middle" font-size="12" fill="#52514e">passwords and tokens, never in arguments</text><rect x="294" y="192" width="294" height="46" rx="8" fill="#256abf" stroke="#256abf"/><text x="441" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Permission gate</text><text x="441" y="230" text-anchor="middle" font-size="12" fill="#ffffff" opacity="0.9">reads on · Update and Delete need a grant</text><rect x="294" y="246" width="294" height="46" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="441" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Partial-result checks</text><text x="441" y="284" text-anchor="middle" font-size="12" fill="#52514e">shard failures and timeouts reported</text><rect x="294" y="300" width="294" height="46" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="441" y="320" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Diagnostic redaction</text><text x="441" y="338" text-anchor="middle" font-size="12" fill="#52514e">credentials removed from error details</text><rect x="676" y="137" width="188" height="110" rx="8" fill="#f4f3f0" stroke="#e3e2de"/><text x="770" y="189" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">OpenSearch REST API</text><text x="770" y="207" text-anchor="middle" font-size="12" fill="#52514e">41 of 490 operations</text><path d="M606 192 C641 192 641 192 669 192" fill="none" stroke="#52514e" stroke-width="1.5"/><path d="M676 192 l-8 -4.5 v9 z" fill="#52514e"/></svg>
